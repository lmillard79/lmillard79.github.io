# Site Settings
title: "Lindsay Millard"
description: "Principal Hydrologist & Chartered Engineer (RPEQ, CEng MICE, CPEng, FIEAust) specialising in flood risk mitigation, water storage modelling, dam safety, and extreme event analysis."
url: "https://lmillard79.github.io"
repository: "lmillard79/lmillard79.github.io"
locale: "en-AU"

# Author Info
author:
  name: "Lindsay Millard"
  avatar: "/images/PenPic_WRM.png"
  bio: "Principal Hydrologist & Chartered Engineer. RPEQ · CEng MICE · CPEng · FIEAust. 20+ years across flood risk, dam safety, and water resources."
  location: "Brisbane, Australia"
  email: "lindsay.millard@outlook.com.au"
  links:
    - label: "GitHub"
      url: "https://github.com/lmillard79"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/lindsaymillard"

# Theme Settings
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "dark" # Starting with dark base for premium feel

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate

# Build Settings
markdown: kramdown
highlighter: rouge
paginate: 5
paginate_path: /blog/page:num/

# Navigation
nav:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Projects"
    url: "/projects/"
  - title: "Expertise"
    url: "/services/"
  - title: "Python"
    url: "/python/"
  - title: "Blog"
    url: "/blog/"

# SEO
seo:
  name: "Lindsay Millard"
  type: Person
  links:
    - "https://github.com/lmillard79"
    - "https://www.linkedin.com/in/lindsaymillard"

# Analytics
analytics:
  provider: "google"
  google:
    tracking_id: "G-G7EJXT9KGR"

# _pages starts with an underscore, so Jekyll ignores it by default unless
# explicitly included here. Without this, every page in _pages/ (About,
# Services, Projects, Publications, Insights, Python) silently 404s.
include:
  - _pages

# Exclude from checks/builds
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - notebooks
  # Internal working notes -- kept in the repo for reference, not published
  - _pages/resources/seo-plan.md
  - _pages/resources/sitemap-submission-guide.md

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
